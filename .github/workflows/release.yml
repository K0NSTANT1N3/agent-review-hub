name: Release

# Builds the desktop installers natively on each OS (native modules and the bundled Claude Code CLI are
# platform-specific) and, for v* tags, attaches them to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # node-gyp needs Python when no prebuilt better-sqlite3 exists for this Electron version.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @quorum/desktop stage
      - run: node packages/desktop/scripts/package.mjs
        env:
          # Unsigned builds; see docs/INSTALL.md for first-launch steps on macOS and Windows.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke-test bundled CLI and terminal UI
        run: node packages/desktop/scripts/smoke-cli.mjs
      - name: Check npm package contents (no publish)
        run: pnpm check:npm-pack
      - uses: actions/upload-artifact@v4
        with:
          name: quorum-${{ matrix.os }}
          path: |
            packages/desktop/release/Quorum-*.AppImage
            packages/desktop/release/Quorum-*.deb
            packages/desktop/release/Quorum-*.dmg
            packages/desktop/release/Quorum-*.exe
          if-no-files-found: error

  publish:
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
