appId: dev.agentreviewhub.quorum
productName: Quorum
executableName: quorum
artifactName: Quorum-${version}-${os}-${arch}.${ext}
directories:
  output: release
  # App icons live here; regenerate them from build/icon.svg with `npx electron scripts/icons.mjs`.
  buildResources: build
files:
  - dist/**
  - package.json
  - node_modules/**
asarUnpack:
  - "**/*.node"
  - "**/@anthropic-ai/**"
npmRebuild: false
linux:
  target: [AppImage, deb]
  executableName: quorum
  category: Development
  icon: icons
  maintainer: Agent Review Hub contributors <noreply@example.com>
mac:
  target: [dmg]
  category: public.app-category.developer-tools
  icon: icon.icns
win:
  target: [nsis]
  icon: icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish: null
