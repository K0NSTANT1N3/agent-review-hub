appId: dev.agentreviewhub.quorum
productName: Quorum
executableName: quorum
artifactName: Quorum-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - node_modules/**
asarUnpack:
  - "**/*.node"
  - "**/@anthropic-ai/**"
npmRebuild: false
linux:
  target: [AppImage, deb]
  executableName: quorum
  category: Development
  maintainer: Agent Review Hub contributors <noreply@example.com>
mac:
  target: [dmg]
  category: public.app-category.developer-tools
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish: null
